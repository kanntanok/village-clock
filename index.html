<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ピクセル農村時計</title>
<meta name="theme-color" content="#0b1030">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--accent:#ffd36e;--ink:#fff8e6;
  --font:"DotGothic16","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP","Meiryo",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b1030;overflow:hidden;color:var(--ink);font-family:var(--font);font-size:16px;
  -webkit-text-size-adjust:100%}
button,input,textarea,select{font-family:inherit}
button{-webkit-tap-highlight-color:transparent}
canvas{image-rendering:crisp-edges;image-rendering:pixelated}
#world{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center bottom}
#world.inplace{position:relative;inset:auto;display:block;width:var(--pw);height:var(--ph);max-width:none;object-fit:fill;
  touch-action:pan-x pan-y;cursor:grab;margin:0 auto}

/* ===== ピクセル枠（9スライス画像を JS で生成して --f-* に入れる） ===== */
/* 大枠: 12px = 4ドット × 3px */
#panel,.card,.cframe{border:12px solid transparent;border-image:var(--f-card) 48 fill/12px stretch}
#panel{border-image-source:var(--f-panel)}
.cframe{border-image-slice:48;border-image-width:12px}   /* 中身を塗らない額縁 */
.fbar,#gain{border:9px solid transparent;border-image:var(--f-bar) 36 fill/9px stretch}
.chip{border:6px solid transparent;border-image:var(--f-chip) 24 fill/6px stretch}

/* ===== デジタル時計パネル ===== */
#panel{position:fixed;top:max(3vh,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:1;
  text-align:center;padding:2px 10px 4px;max-width:96vw;box-shadow:0 0 22px 8px rgba(5,8,20,.4)}
#time{display:block;margin:0 auto}
.date{margin-top:8px;font-size:clamp(16px,3.6vw,26px);letter-spacing:.06em;color:#fff;text-shadow:2px 2px 0 #000}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.chip{display:flex;align-items:center;padding:0 6px;font-size:clamp(13px,2.9vw,16px);color:#fff;text-shadow:1px 1px 0 #000;white-space:nowrap}
/* 連続ログイン・天気情報は時計より控えめに表示 */
#streakChip,#wxChip{border:0;background:transparent;box-shadow:none;padding:0 3px;color:#aab5d2;font-size:clamp(10px,2.4vw,13px);text-shadow:none;opacity:.82}
#streakChip b{color:#c2cbe0;font-weight:normal}
.chip b{color:var(--accent);font-weight:normal}
@keyframes flash{0%,100%{filter:none}50%{filter:brightness(2.2)}}
.chip.flash{animation:flash .5s 3}
.pxicon{width:16px;height:16px;vertical-align:-3px;margin-right:5px}

/* ===== ピクセルボタン（凸 = 通常 / 凹 = 押下・選択中） ===== */
.pbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;color:#fff;cursor:pointer;background:none;
  font-size:14px;line-height:1.25;text-shadow:2px 2px 0 rgba(0,0,0,.65);padding:2px 8px 5px;
  border:9px solid transparent;border-image:var(--f-btn) 36 fill/9px stretch;
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
.pbtn:hover:not(:disabled){filter:brightness(1.2)}
.pbtn:active:not(:disabled),.pbtn.on{border-image-source:var(--f-btn-on);padding:5px 8px 2px}
.pbtn:disabled{opacity:.38;cursor:default}
.pbtn.go{border-image-source:var(--f-go);font-size:16px;padding:3px 18px 6px;letter-spacing:.1em}
.pbtn.go:active:not(:disabled){border-image-source:var(--f-go-on);padding:6px 18px 3px}
.pbtn.red{border-image-source:var(--f-red)}
.pbtn.red:active:not(:disabled){border-image-source:var(--f-red-on);padding:5px 8px 2px}
.pbtn.ib{padding:3px 5px 6px}
.pbtn.ib:active:not(:disabled),.pbtn.ib.on{padding:6px 5px 3px}
.pbtn.sm{border-width:6px;border-image-source:var(--f-btn-s);border-image-slice:24 fill;border-image-width:6px;
  font-size:12px;padding:1px 6px 4px}
.pbtn.sm:active:not(:disabled){border-image-source:var(--f-btn-s-on);padding:4px 6px 1px}
.pbtn.sm.red{border-image-source:var(--f-red-s)}
.pbtn.sm.red:active:not(:disabled){border-image-source:var(--f-red-s-on)}
.pbtn.wide{width:100%}
.pbtn.dis,.pbtn.dis:disabled{border-image-source:var(--f-dis);opacity:1;cursor:default;color:#6f7390;text-shadow:none;filter:none;padding:1px 6px 4px}
.pbtn.sm.dis{border-image-source:var(--f-dis-s)}
canvas.ic{display:block;width:36px;height:36px}
.pbtn.wide canvas.ic{width:24px;height:24px}
#dock{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:8px;z-index:5}

/* ===== モーダル共通 ===== */
#modal,#bmodal,#lmodal,#cmodal,#pvmodal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .35s}
#modal{z-index:10;background:rgba(5,8,20,.58)}
#bmodal{z-index:12;background:rgba(5,8,20,.68)}
#lmodal{z-index:20;background:rgba(5,8,20,.68)}
#cmodal,#pvmodal{z-index:30;background:rgba(5,8,20,.62)}
#modal.hide,#bmodal.hide,#lmodal.hide,#cmodal.hide,#pvmodal.hide{opacity:0;pointer-events:none}
.card{width:min(92vw,430px);color:#fff;padding:4px 8px 8px}
.card h2{margin:0 0 8px;font-size:22px;font-weight:normal;color:var(--accent);letter-spacing:.1em;text-shadow:2px 2px 0 #000}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:3px dotted rgba(255,255,255,.22);font-size:16px}
.row span:first-child{color:#c6d1f7;white-space:nowrap}
.row b{font-weight:normal;text-align:right}
.msg{margin:12px 0 4px;font-size:15px;line-height:1.7;color:#ffe9a8}
.card>.pbtn.go{display:flex;margin:14px auto 0}
.note{margin-top:10px;font-size:12px;color:#ff9f9f;text-align:center}
.btns{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:12px}
.cc{width:min(88vw,360px);text-align:center}
.cc p{white-space:pre-line;font-size:16px;line-height:1.7;margin:10px 4px 4px}

/* 獲得バナー */
#gain{position:fixed;left:50%;top:max(10px,env(safe-area-inset-top));transform:translate(-50%,-170%);z-index:14;padding:0 14px 3px;
  font-size:16px;color:#fff;text-shadow:2px 2px 0 #000;transition:transform .35s;pointer-events:none;white-space:nowrap}
#gain.show{transform:translate(-50%,0)}

/* ===== ビルド画面 ===== */
#bClose,#lClose{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));z-index:2}
.bcard{width:min(94vw,470px);max-height:92vh;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:thin;scrollbar-color:var(--accent) #0b1030}
.bcard h3{margin:16px 0 8px;font-size:16px;font-weight:normal;color:var(--accent);letter-spacing:.1em;text-shadow:2px 2px 0 #000}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bhead h2{margin:0}
.bbal{display:flex;align-items:center;gap:6px;font-size:20px;color:#fff;white-space:nowrap;text-shadow:2px 2px 0 #000}
.bbal .pxicon{width:20px;height:20px;margin:0}
@media (max-width:560px){.bhead{padding-right:58px}}
.bprog{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:#c6d1f7}
.bprog span{white-space:nowrap}
.bbar{flex:1;height:24px;border:6px solid transparent;border-image:var(--f-inset) 24 fill/6px stretch}
.bbar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--accent) 0 6px,transparent 6px 9px)}
.nrow{display:flex;align-items:flex-end;gap:8px;margin-top:8px}
.bname{flex:1;min-width:0;font-size:13px;color:#c6d1f7}
.pin{display:block;width:100%;margin-top:3px;font-size:16px;color:#fff;background:none;outline:none;border-radius:0;
  border:6px solid transparent;border-image:var(--f-inset) 24 fill/6px stretch;padding:3px 6px}
.pin:focus{filter:brightness(1.35)}
.pin:disabled{opacity:.45}
.cframe{width:fit-content;max-width:100%;margin:10px auto 8px;line-height:0}
#bCanvas{display:block;width:min(calc(86vw - 24px),340px);height:auto;touch-action:none;cursor:crosshair;
  -webkit-user-select:none;user-select:none;background:#111633}
.trow{display:flex;justify-content:space-between;align-items:center;gap:8px;width:min(100%,364px);margin:0 auto}
.tgrp{display:flex;gap:6px}
.bpal{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin:10px auto 0;width:min(100%,364px)}
.sw{aspect-ratio:1;padding:0;cursor:pointer;border:6px solid transparent;border-image:var(--f-sw) 24/6px stretch;
  background-clip:padding-box;border-radius:0}
.sw.on{border-image-source:var(--f-sw-on)}
#bMsg{min-height:22px;margin-top:6px;font-size:13px;line-height:1.5;color:#ffe9a8;text-align:center}
.blist{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
.blist th{font-weight:normal;color:#aebbe8;text-align:left;padding:4px;border-bottom:3px solid rgba(255,255,255,.3)}
.blist td{padding:6px 4px;border-bottom:3px dotted rgba(255,255,255,.22);vertical-align:middle}
.blist tr.cur td{background:rgba(255,211,110,.14)}
.blist canvas{display:block;width:40px;height:40px;background:#0a0f2a;box-shadow:0 0 0 3px #000}
.blist td.empty{text-align:center;color:#aebbe8;padding:14px 4px}
.bact{display:flex;flex-wrap:wrap;gap:4px}
.bn{word-break:break-all}

/* ===== 設置画面（背景の外側に操作用の縁） ===== */
#place{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;gap:8px;
  padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));
  background-color:#171231;background-image:var(--pat);background-size:24px 24px}
#place[hidden]{display:none}
.fbar{flex:none;color:#fff;padding:0 6px 3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}
.pinfo{display:flex;flex-direction:column;min-width:0;flex:1 1 150px}
.pinfo b{font-weight:normal;font-size:16px;color:var(--accent);text-shadow:2px 2px 0 #000;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phint{font-size:11px;color:#aebbe8;line-height:1.5}
#pChips{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding-bottom:2px}
.thumb canvas{width:30px;height:30px;background:#0a0f2a}
#pstage{flex:1 1 0;min-height:0;position:relative;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:var(--accent) #0b1030;
  background:#0b1030;background-clip:padding-box;border:12px solid transparent;border-image:var(--f-card) 48/12px stretch}
.pgrp{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center}
.pbot{justify-content:center;gap:10px}

/* ===== 設置画面の構造物一覧・呼び出し確認 ===== */
.pv{display:flex;flex-direction:column;align-items:center;gap:6px}
.pv .cframe{margin:6px auto 4px}
#pvCanvas{display:block;width:min(60vw,220px);height:auto;background:#111633}
.pv b{font-weight:normal;font-size:18px;color:var(--accent);text-shadow:2px 2px 0 #000;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bUndo canvas.ic,#bRedo canvas.ic{width:24px;height:24px}
@media (max-width:420px){.trow .tgrp{gap:4px}.trow .pbtn.ib{padding-left:3px;padding-right:3px}}

.chip[hidden]{display:none}
#locBtn canvas.ic{width:24px;height:24px}
</style>
<link rel="apple-touch-icon" href="./icon.PNG">
<link rel="icon" type="image/png" href="./icon.PNG">

</head>
<body>
<canvas id="world"></canvas>

<div id="panel">
  <canvas id="time" width="27" height="9" role="img" aria-label="現在時刻"></canvas>
  <div class="date" id="date"></div>
  <div class="chips">
    <span class="chip" id="streakChip"></span>
    <span class="chip" id="wxChip" hidden></span>
    <span class="chip" id="pxChip"><canvas class="pxicon" width="8" height="8"></canvas><b id="pxNum">× 0</b></span>
  </div>
</div>

<div id="dock">
  <button id="locBtn" class="pbtn ib" type="button" aria-label="現在地の天気と同期" title="現在地の天気と同期"><canvas class="ic" data-ico="pin"></canvas></button>
  <button id="buildBtn" class="pbtn" type="button">ビルド</button>
  <button id="placeBtn" class="pbtn" type="button">配置</button>
  <button id="recBtn" class="pbtn" type="button">ログイン記録</button>
</div>

<div id="modal" class="hide" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="card">
    <h2 id="mTitle">ログイン記録</h2>
    <div id="rows"></div>
    <div class="msg" id="msg"></div>
    <button class="pbtn go" id="goBtn" type="button">村へ行く</button>
    <div class="note" id="note" hidden>※この環境では記録を保存できません（ブラウザの保存設定を確認してください）</div>
  </div>
</div>

<div id="gain" role="status"></div>

<!-- ===== ビルド画面 ===== -->
<div id="bmodal" class="hide" role="dialog" aria-modal="true" aria-labelledby="bTitle">
  <button type="button" class="pbtn red ib" id="bClose" aria-label="閉じる"><canvas class="ic" data-ico="close"></canvas></button>
  <div class="card bcard">
    <div class="bhead"><h2 id="bTitle">ビルド</h2><div class="bbal"><canvas class="pxicon" width="8" height="8"></canvas><span id="bBal">× 0</span></div></div>
    <div class="bprog"><div class="bbar"><i id="bBarI"></i></div><span id="bProg"></span></div>
    <div class="nrow">
      <label class="bname">名前<input class="pin" id="bName" type="text" maxlength="20" autocomplete="off"></label>
      <button type="button" class="pbtn ib" id="bDel" aria-label="この構造物を削除" title="削除"><canvas class="ic" data-ico="trash"></canvas></button>
    </div>
    <div class="cframe"><canvas id="bCanvas" width="320" height="320" aria-label="20×20の描画キャンバス"></canvas></div>
    <div class="trow">
      <div class="tgrp" role="group" aria-label="ツール">
        <button type="button" class="pbtn ib" data-tool="pen" aria-label="描く" title="描く"><canvas class="ic" data-ico="pencil"></canvas></button>
        <button type="button" class="pbtn ib" data-tool="eraser" aria-label="消す" title="消す"><canvas class="ic" data-ico="eraser"></canvas></button>
        <button type="button" class="pbtn ib" data-tool="pick" aria-label="スポイト" title="スポイト"><canvas class="ic" data-ico="dropper"></canvas></button>
      </div>
      <div class="tgrp">
        <button type="button" class="pbtn ib" id="bUndo" aria-label="ひとつ戻る" title="ひとつ戻る"><canvas class="ic" data-ico="undo"></canvas></button>
        <button type="button" class="pbtn ib" id="bRedo" aria-label="元に戻す" title="元に戻す"><canvas class="ic" data-ico="redo"></canvas></button>
      </div>
    </div>
    <div class="bpal" id="bPal"></div>
    <div id="bMsg" role="status"></div>
    <div class="btns" style="margin-top:4px"><button type="button" class="pbtn go" id="bPlace">設置/位置変更</button></div>
    <h3>構造物の一覧</h3>
    <button type="button" class="pbtn wide" id="bCreate"><canvas class="ic" data-ico="plus"></canvas>新たな構造物を作成</button>
    <table class="blist"><thead><tr><th>絵</th><th>名前</th><th>状態</th><th>ピクセル</th><th>操作</th></tr></thead><tbody id="bRows"></tbody></table>
  </div>
</div>

<!-- ===== 設置画面：背景の外側に操作用の縁 ===== -->
<div id="place" hidden>
  <div class="fbar ptop">
    <div class="pinfo"><b id="pName"></b><span class="phint">構造物をドラッグで移動／背景はスクロール</span></div>
    <div id="pChips"></div>
  </div>
  <div id="pstage"></div>
  <div class="fbar pbot">
    <div class="pgrp">
      <button type="button" class="pbtn ib" data-dx="-1" data-dy="0" aria-label="左へ1ピクセル"><canvas class="ic" data-ico="arrowL"></canvas></button>
      <button type="button" class="pbtn ib" data-dx="0" data-dy="-1" aria-label="上へ1ピクセル"><canvas class="ic" data-ico="arrowU"></canvas></button>
      <button type="button" class="pbtn ib" data-dx="0" data-dy="1" aria-label="下へ1ピクセル"><canvas class="ic" data-ico="arrowD"></canvas></button>
      <button type="button" class="pbtn ib" data-dx="1" data-dy="0" aria-label="右へ1ピクセル"><canvas class="ic" data-ico="arrowR"></canvas></button>
    </div>
    <div class="pgrp">
      <button type="button" class="pbtn ib" id="pList" aria-label="構造物一覧" title="構造物一覧"><canvas class="ic" data-ico="list"></canvas></button>
      <button type="button" class="pbtn" id="pUn">外す</button>
      <button type="button" class="pbtn" id="pEdit">編集</button>
      <button type="button" class="pbtn go" id="pDone">完了</button>
    </div>
  </div>
</div>

<!-- ===== 設置画面：構造物一覧（ビルド画面に倣う） ===== -->
<div id="lmodal" class="hide" role="dialog" aria-modal="true" aria-labelledby="lTitle">
  <button type="button" class="pbtn red ib" id="lClose" aria-label="閉じる"><canvas class="ic" data-ico="close"></canvas></button>
  <div class="card bcard">
    <div class="bhead"><h2 id="lTitle">構造物の一覧</h2></div>
    <table class="blist"><thead><tr><th>絵</th><th>名前</th><th>状態</th><th>ピクセル</th><th>操作</th></tr></thead><tbody id="lRows"></tbody></table>
  </div>
</div>

<!-- ===== 呼び出し確認（構造物の絵つき） ===== -->
<div id="pvmodal" class="hide" role="alertdialog" aria-modal="true" aria-labelledby="pvName">
  <div class="card cc pv">
    <div class="cframe"><canvas id="pvCanvas" width="200" height="200"></canvas></div>
    <b id="pvName"></b>
    <div class="btns"><button type="button" class="pbtn" id="pvNo">キャンセル</button><button type="button" class="pbtn go" id="pvOk">設置</button></div>
  </div>
</div>

<!-- ===== 確認ダイアログ（ブラウザ標準の confirm は埋め込み環境で動かないため自前） ===== -->
<div id="cmodal" class="hide" role="alertdialog" aria-modal="true" aria-labelledby="cMsg">
  <div class="card cc">
    <p id="cMsg"></p>
    <div class="btns"><button type="button" class="pbtn" id="cNo">やめる</button><button type="button" class="pbtn red" id="cOk">削除</button></div>
  </div>
</div>

<script>
(() => {
'use strict';
/* =====================================================================
   設定
   ===================================================================== */
const W = 192;                       // 論理ピクセル幅
const MAXSTAGE = 5;
const THRESH = [0, 2, 4, 7, 12, 20]; // 各段階に到達するのに必要な連続日数（途絶後は1段階戻り、再び積み上げ）
const KEY = 'pixelVillageClock.v1';
const $ = id => document.getElementById(id);

/* =====================================================================
   表示テキスト
   ===================================================================== */
const WD_JA = ['日', '月', '火', '水', '木', '金', '土'];
const TXT = {
  note: '※この環境では記録を保存できません（ブラウザの保存設定を確認してください）',
  stages: ['開拓地', '小さな集落', 'のどかな里', '豊かな村', '栄える郷', '繁栄の里'],
  rCount: 'ログイン回数', vCount: n => `${n} 回目`, rNow: '今回のログイン', rPrev: '前回のログイン', firstLogin: '—（初ログイン）',
  rStreak: '連続ログイン', vDays: n => `${n} 日`, rBest: '最長連続記録', rStage: '村の発展段階',
  date: j => `${j.y}年${j.mo}月${j.d}日(${WD_JA[j.wd]})`,
  ts: j => `${j.y}/${p2(j.mo)}/${p2(j.d)}(${WD_JA[j.wd]}) ${p2(j.h)}:${p2(j.mi)}`,
  chipStreak: n => `連続ログイン <b>${n}日</b>`, chipLv: (lv, nm) => `<b>Lv.${lv}</b> ${nm}`,
  mPreview: 'プレビュー表示中です（ログイン記録は更新されません）。',

function drawFlash() {

}

/* =====================================================================
   現在地の季節・時間帯・天気を背景に同期（Open-Meteo。位置は約11km単位に丸めて送信）
   ===================================================================== */
const LKEY = 'pixelVillageClock.loc.v1';
const LOC = { on: false, lat: null, lon: null, tz: '', sr: null, ss: null, at: 0 };
const WX = { kind: 'clear', gray: 0, int: 0, cloudsMax: null };
const WXNAME = { clear: '晴れ', cloudy: 'くもり', fog: '霧', rain: '雨', snow: '雪', storm: '雷雨' };
function wxFromCode(code, cover) {
  const w = { kind: 'clear', gray: 0, int: 0, cloudsMax: null };
  if (code === 3) { w.kind = 'cloudy'; w.gray = 0.35; w.cloudsMax = 6; }
  else if (code === 1 || code === 2) { w.gray = 0.05; w.cloudsMax = 5; }
  else if (code === 45 || code === 48) { w.kind = 'fog'; w.gray = 0.3; }
  else if ((code >= 51 && code <= 57)) { w.kind = 'rain'; w.int = 0.3; w.gray = 0.4; }
  else if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) { w.kind = 'rain'; w.int = (code === 65 || code === 67 || code === 82) ? 1 : 0.65; w.gray = 0.55; }
  else if ((code >= 71 && code <= 77) || code === 85 || code === 86) { w.kind = 'snow'; w.gray = 0.25; }
  else if (code >= 95 && code <= 99) { w.kind = 'storm'; w.int = 1; w.gray = 0.7; }
  if (w.kind === 'clear' && cover > 60) { w.gray = Math.max(w.gray, 0.2); w.cloudsMax = 6; }
  return w;
}
function setWx(w) { Object.assign(WX, { kind: 'clear', gray: 0, int: 0, cloudsMax: null }, w || {}); }
if (PV.wx && WXNAME[PV.wx]) setWx(wxFromCode({ clear: 0, cloudy: 3, fog: 45, rain: 63, snow: 73, storm: 95 }[PV.wx], 0));

function loadLoc() {
  try {
    const o = JSON.parse(localStorage.getItem(LKEY) || 'null');
    if (!o || !o.on || typeof o.tz !== 'string') return;
    new Intl.DateTimeFormat('en-US', { timeZone: o.tz });
    Object.assign(LOC, { on: true, lat: +o.lat, lon: +o.lon, tz: o.tz, sr: o.sr == null ? null : +o.sr, ss: o.ss == null ? null : +o.ss, at: +o.at || 0 });
    if (o.wx) setWx(o.wx);
  } catch (e) {}
}
function saveLoc() {
  try { localStorage.setItem(LKEY, JSON.stringify({ on: LOC.on, lat: LOC.lat, lon: LOC.lon, tz: LOC.tz, sr: LOC.sr, ss: LOC.ss, at: LOC.at, wx: { kind: WX.kind, gray: WX.gray, int: WX.int, cloudsMax: WX.cloudsMax } })); } catch (e) {}
}
const lfmt = {};
function localParts(tz, ms) {
  const f = lfmt[tz] || (lfmt[tz] = new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', month: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric' }));
  const o = {};
  for (const p of f.formatToParts(new Date(ms))) o[p.type] = p.value;
  return { mo: +o.month, hf: (+o.hour) % 24 + (+o.minute) / 60 + (+o.second) / 3600 };
}
let _bj = null, _bv = null;
function bgView(j) {                     // 背景用の「月・時刻・日の出日の入り」（同期中は取得した位置のもの）
  if (_bj === j && _bv) return _bv;
  let mo = j.mo, hf = j.hf, sr = SUN[mo][0], ss = SUN[mo][1];
  if (LOC.on && LOC.tz) {
    const o = localParts(LOC.tz, Date.now());
    if (PV.month === null) mo = o.mo;
    if (PV.hour === null) hf = o.hf;
    if (LOC.sr != null && LOC.ss != null && LOC.sr < LOC.ss) { sr = LOC.sr; ss = LOC.ss; } else { sr = SUN[mo][0]; ss = SUN[mo][1]; }
  }
  const south = LOC.on ? LOC.lat < 0 : !!PV.south;
  _bj = j; _bv = { mo: south ? (mo + 5) % 12 + 1 : mo, hf, sr, ss };
  return _bv;
}
function wxSky(top, bot) {
  if (WX.gray < 0.01) return { top, bot };
  const gr = mix('#8e98ab', '#171d38', DARK);
  return { top: mix(top, gr, WX.gray * 0.8), bot: mix(bot, gr, WX.gray * 0.6) };
}
const wxClouds = n => WX.cloudsMax == null ? n : Math.max(n, WX.cloudsMax);
const wxCloudColor = c => mix(c, mix('#7e889b', '#1c2340', DARK), WX.gray * 0.7);
const wf = y => 0.3 + 0.7 * clamp((y - H * 0.12) / (H * 0.35), 0, 1);   // 画面上部（時計周辺）の演出を薄くする
function wxParticles() {                 // 雨・雪のとき、季節の粒（花びら・落ち葉）の代わりに描く
  const k = WX.kind;
  if (k === 'rain' || k === 'storm') {
    const n = Math.round(14 + 30 * WX.int);
    ctx.fillStyle = DARK > 0.5 ? '#7f9fd8' : '#b4c9e7';
    for (let i = 0; i < n; i++) {
      const f = parts[i % parts.length], y = (f.y * 1.7 + T * (80 + f.s * 50)) % H, x = (((f.x * 2.1 + i * 13 - y * 0.18) % W) + W) % W;
      ctx.globalAlpha = 0.5 * wf(y); ctx.fillRect(Math.round(x), Math.round(y), 1, 3);
    }
    ctx.globalAlpha = 1; return true;
  }
  if (k === 'snow') {
    for (let i = 0; i < 40; i++) {
      const f = parts[i % parts.length];
      const x = ((f.x + Math.sin(T * 0.7 + f.ph) * 3 + f.vx * T * 0.4) % W + W) % W, y = (f.y % H + T * f.vy * 0.8) % H;
      ctx.globalAlpha = (0.4 + 0.3 * f.s) * wf(y); ctx.fillStyle = '#ffffff';
      ctx.fillRect(Math.round(x), Math.round(y), 1, 1);
    }
    ctx.globalAlpha = 1; return true;
  }
  return false;
}
function drawWxOverlay() {
  if (WX.gray > 0.02) { ctx.globalAlpha = WX.gray * 0.16; ctx.fillStyle = DARK > 0.5 ? '#080d24' : '#6a7589'; ctx.fillRect(0, 0, W, H); }
  if (WX.kind === 'fog') {
    ctx.fillStyle = DARK > 0.5 ? '#46506e' : '#e3e9f1';
    ctx.globalAlpha = 0.16; ctx.fillRect(0, 0, W, H);
    for (let y = 0; y < H; y += 4) { ctx.globalAlpha = (0.04 + 0.04 * Math.sin(T * 0.6 + y * 0.35)) * wf(y); ctx.fillRect(0, y, W, 2); }
  }

    if (ph < 0.1 || (ph > 0.26 && ph < 0.34)) { ctx.globalAlpha = 0.12; ctx.fillStyle = '#dfe6f5'; ctx.fillRect(0, H * 0.35, W, H * 0.65); }
  }
  ctx.globalAlpha = 1;
}

/* ---------- 取得・同期 ---------- */
const r1 = v => Math.round(v * 10) / 10;
const hrs = s => { const m = /T(\d+):(\d+)/.exec(s || ''); return m ? +m[1] + (+m[2]) / 60 : null; };
function getPos() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('nogeo'));
    navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: false, timeout: 12000, maximumAge: 600000 });
  });
}
async function fetchWx(lat, lon) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=weather_code,cloud_cover&daily=sunrise,sunset&timezone=auto&forecast_days=1`;
  const ac = new AbortController(), t = setTimeout(() => ac.abort(), 10000);

  finally { clearTimeout(t); }
}
function applyData(d) {
  if (!d || !d.current || typeof d.timezone !== 'string') throw new Error('bad');
  new Intl.DateTimeFormat('en-US', { timeZone: d.timezone });
  LOC.tz = d.timezone;
  LOC.sr = hrs(d.daily && d.daily.sunrise && d.daily.sunrise[0]); LOC.ss = hrs(d.daily && d.daily.sunset && d.daily.sunset[0]);
  setWx(wxFromCode(+d.current.weather_code, +d.current.cloud_cover || 0));
  LOC.at = Date.now(); _bj = null;
}
let toastT = null;
function toast(t) { $('gain').textContent = t; $('gain').classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => $('gain').classList.remove('show'), 3500); }
async function syncLoc(interactive) {
  try { const p = await getPos(); LOC.lat = r1(p.coords.latitude); LOC.lon = r1(p.coords.longitude); }
  catch (e) { if (interactive) { toast('位置情報を取得できませんでした'); return false; } if (LOC.lat == null) return false; }
  try { applyData(await fetchWx(LOC.lat, LOC.lon)); }
  catch (e) { if (interactive) toast('天気を取得できませんでした'); return false; }
  LOC.on = true; saveLoc(); renderLoc(); return true;
}
function renderLoc() {
  $('locBtn').classList.toggle('on', LOC.on);
  $('locBtn').setAttribute('aria-pressed', LOC.on ? 'true' : 'false');
  const ch = $('wxChip');
  if (LOC.on) { ch.hidden = false; ch.textContent = LOC.tz.split('/').pop().replace(/_/g, ' ') + '　' + WXNAME[WX.kind]; } else ch.hidden = true;
}
$('locBtn').addEventListener('click', async () => {
  if (LOC.on) {
    const ok = await askConfirm('現在地との同期をやめますか？\n背景は日本の季節・時間帯に戻ります。', 'やめる');
    if (ok) { LOC.on = false; setWx(null); _bj = null; saveLoc(); renderLoc(); }
  } else {
    $('locBtn').disabled = true;
    try { await syncLoc(true); } finally { $('locBtn').disabled = false; }
  }
});
loadLoc(); renderLoc();
if (LOC.on && Date.now() - LOC.at > 30 * 60 * 1000) syncLoc(false);
setInterval(() => { if (LOC.on && document.visibilityState === 'visible') syncLoc(false); }, 30 * 60 * 1000);
